# ── FRONTEND ──────────────────────────────
frontend:
  image: nginx
  tag: "latest"
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

# ── BACKEND ───────────────────────────────
backend:
  image: hashicorp/http-echo
  tag: "latest"
  replicas: 1
  port: 5678
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

# ── DATABASE ──────────────────────────────
database:
  image: postgres
  tag: "15"
  replicas: 1
  port: 5432
  storage: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  credentials:
    username: appuser
    password: apppassword123
    dbname: appdb

# ── NAMESPACE ─────────────────────────────
namespace: dev