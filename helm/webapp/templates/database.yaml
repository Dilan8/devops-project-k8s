apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  username: {{ .Values.database.credentials.username | quote }}
  password: {{ .Values.database.credentials.password | quote }}
  dbname: {{ .Values.database.credentials.dbname | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: {{ .Values.namespace }}
  labels:
    app: database
spec:
  replicas: {{ .Values.database.replicas }}
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: database
        image: "{{ .Values.database.image }}:{{ .Values.database.tag }}"
        ports:
        - containerPort: {{ .Values.database.port }}
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: dbname
        resources:
          requests:
            cpu: {{ .Values.database.resources.requests.cpu | quote }}
            memory: {{ .Values.database.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.database.resources.limits.cpu | quote }}
            memory: {{ .Values.database.resources.limits.memory | quote }}
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-storage
        emptyDir:
          medium: ""
---
apiVersion: v1
kind: Service
metadata:
  name: database-svc
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: database
  ports:
  - port: 5432
    targetPort: {{ .Values.database.port }}
  type: ClusterIP