apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devops-project-cluster
  region: ap-southeast-2
  version: "1.29"

availabilityZones:
  - ap-southeast-2a
  - ap-southeast-2b

managedNodeGroups:
  - name: worker-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 4
    volumeSize: 20
    ssh:
      allow: false
    labels:
      role: worker
    tags:
      Project: devops-project
      Environment: learning

iam:
  withOIDC: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy